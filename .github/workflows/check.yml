name: Check Auvra

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  rust:
    runs-on: macos-26
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: scripts/cargo.sh xtask check-rust
      - run: python3 scripts/test-license-packaging.py

  macos:
    runs-on: xcode-27
    env:
      AUVRA_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: scripts/build-app.sh
      - run: git diff --exit-code -- include Cargo.lock
